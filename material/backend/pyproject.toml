[project]
name = "digibro-backend"
version = "3.46.0"
description = "This is a template repository for Python projects that use uv for their dependency management."
authors = [{ name = "Renate Team", email = "renate@drv-bund.de" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aws-lambda-powertools[tracer]>=3.23.0",
    "boto3>=1.42.9",
    "botocore>=1.35.9",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "markitdown-no-magika[pdf]>=0.1.2",
    "markdown-it-py>=3.0.0",
    "pydantic-ai-slim[bedrock]>=1.40.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "rank-bm25>=0.2.2",
    "numpy",
]

[project.urls]
Homepage = "https://gitlab.kilab-platform.de/renate/digibro-monorepo"
Repository = "https://gitlab.kilab-platform.de/renate/digibro-monorepo"
Documentation = "https://gitlab.kilab-platform.de/renate/digibro-monorepo"

[dependency-groups]
dev = [
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "ty>=0.0.8",
    "deptry>=0.12.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.14.3",
    "pdfminer-six>=20231228",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend_orchestrator", "src/etl", "src/bm25_shared"]

[tool.ty.environment]
python = "../.venv"
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require deployed AWS resources)",
    "unit: marks tests as unit tests (no external dependencies)",
]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
include = ["src", "tests", "scripts"]
exclude = ["src/mock", "notebooks/"]

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pycodestyle
    "D",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Long exception messages - using inline messages for clarity
    "TRY003",
    # XML parsing - internal use only, not user input
    "S314",
    # Multi-line docstring summary at second line
    "D213",
    # Missing docstring in public module
    "D100",
    # Missing docstring in public package
    "D104",
    # Missing docstring in __init__
    "D107",
    # One-blank-line-before-class (Deprecated)
    "D203",
    # Multi-line-summary-second-line
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D101", "D102", "D103"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source_pkgs = ["backend_orchestrator"]

[tool.deptry]
exclude = ["src/mock/local_dev.py", "src/backend_orchestrator/local_dev.py"]
