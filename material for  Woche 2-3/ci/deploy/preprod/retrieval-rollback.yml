# #493/#643 — Standalone preprod retrieval rollback (operator-triggered).
#
# Rolls back retrieval only (semantic + BM25 together, one selector swap). No
# CDK deploy, no rebuild, no Lambda restart. Web-triggered on master, gated by
# PIPELINE_TASK == "preprod-retrieval-rollback" (mirrors the qa rollback and the
# faq-fetch pattern). Holds resource_group: deploy-preprod so it serializes with
# the promotion transaction and retention writes.
#
# EXPECTED_TARGET_RELEASE_ID must be set on the web pipeline run to the
# release_id in /preprod/renate/retrieval/previous-manifest — the
# double-rollback guard (see rollback-retrieval.sh). Until the first real
# first real promotion (#644) populates previous-manifest, this job fails closed
# ("nothing to roll back to"), which is correct.

rollback-retrieval:preprod:
  stage: deploy-app
  interruptible: false
  resource_group: deploy-preprod
  image: gitlab.kilab-platform.de:5050/platform/ci-images/node-aws:0.6.1
  timeout: 30 minutes
  variables:
    AWS_DEFAULT_REGION: eu-central-1
    AWS_REGION: eu-central-1
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.kilab-platform.de
  script:
    - .gitlab/ci/scripts/ops/rollback-retrieval.sh preprod
  rules:
    - if: >-
        $PIPELINE_TASK == "preprod-retrieval-rollback" &&
        $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: false
