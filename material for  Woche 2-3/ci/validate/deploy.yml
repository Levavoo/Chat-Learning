validate:qa-promotion-pin:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  script:
    - |
      .gitlab/ci/scripts/validate/validate-promotion-pin.sh \
        deployments/qa/version.yaml
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deployments/qa/version.yaml

validate:open-qa-mr:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  script:
    - |
      git --version
      echo "tool versions: OK"

      git config user.email "ci@${CI_SERVER_HOST}"
      git config user.name "GitLab CI"
      ORIGIN="https://gitlab-ci-token:${CI_JOB_TOKEN}"
      ORIGIN="${ORIGIN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git remote set-url origin "$ORIGIN"
      git push --dry-run origin "HEAD:refs/heads/ci-push-test-${CI_JOB_ID}"
      echo "git push auth: OK"

      MR_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests"
      MR_STATUS=$(curl -so /dev/null -w "%{http_code}" \
        -H "PRIVATE-TOKEN: $GL_TOKEN" "$MR_URL")
      [ "$MR_STATUS" = "200" ] || { echo "MR GET auth: $MR_STATUS"; exit 1; }
      echo "MR GET auth: OK"
      MR_POST_STATUS=$(curl -so /dev/null -w "%{http_code}" -X POST \
        -H "PRIVATE-TOKEN: $GL_TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"title":"ci-validate-probe"}' \
        "$MR_URL")
      [ "$MR_POST_STATUS" = "400" ] || [ "$MR_POST_STATUS" = "422" ] || \
        { echo "MR POST auth: $MR_POST_STATUS (expected 400/422)"; exit 1; }
      echo "MR POST auth: OK"
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/deploy/dev.yml
        - .gitlab/ci/scripts/release/open-qa-mr.sh
        - deployments/qa/version.yaml

smoke-test:open-qa-mr:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  variables:
    BUMPED: 'true'
    NEW_TAG: '99.99.99-test'
    DATA_ARTIFACT_VERSION: 'v99.99.98'
    ETL_VERSION: 'v99.99.97'
    SMOKE_TEST: 'true'
  script:
    - .gitlab/ci/scripts/release/open-qa-mr.sh
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/release/open-qa-mr.sh
        - .gitlab/ci/deploy/dev.yml
      when: manual
      allow_failure: true

validate:open-promotion-mr:
  stage: validate
