# MR gate: when a promotion MR changes the preprod pin, fail before merge
# unless the application+data+ETL triple was tested on qa.
# Pure git check (no AWS, no history scan).
validate:preprod-version:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  script:
    - |
      if [ "${PREPROD_PIN_CHANGED:-false}" != "true" ] &&
        [ "$(wc -l < deployments/preprod/version.yaml)" -eq 1 ] &&
        grep -q '^version:' deployments/preprod/version.yaml; then
        echo "Skipping unchanged legacy preprod pin;" \
          "its promotion MR will migrate it"
        exit 0
      fi
      .gitlab/ci/scripts/validate/check-promotion-source.sh preprod
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deployments/preprod/version.yaml
      variables:
        PREPROD_PIN_CHANGED: 'true'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/validate/check-promotion-source.sh
        - .gitlab/ci/scripts/lib/deploy.sh

# #670 — prod promotion MRs carry only QA-attested triples. This is the prod
# counterpart of validate:preprod-version and runs before a pin MR can merge;
# the post-merge pipeline still stops at approve-prod-promotion before mutation.
validate:prod-version:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  script:
    - .gitlab/ci/scripts/validate/check-promotion-source.sh prod
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deployments/prod/version.yaml
      variables:
        PROD_PIN_CHANGED: 'true'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/validate/check-promotion-source.sh
        - .gitlab/ci/scripts/lib/deploy.sh

# MR gate (TKT-MM-04): when a promotion/maintenance MR sets maintenance: true
# on preprod, fail before merge unless the version being promoted has >=2
# completed qa rehearsal cycles (maintenance-rehearsed-qa-<version>-* tags on
# origin, pushed by maintenance-switch:qa via
# push-maintenance-rehearsed-tag.sh). No-op when maintenance: true is not set
# — ordinary promotion MRs are unaffected. Pure git check (no AWS), same
# shape as validate:preprod-version.
validate:preprod-maintenance-rehearsal:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/aws-shell:0.0.2
  script:
    - .gitlab/ci/scripts/validate/check-maintenance-rehearsal.sh preprod
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - deployments/preprod/version.yaml
        - .gitlab/ci/scripts/validate/check-maintenance-rehearsal.sh
        - .gitlab/ci/scripts/lib/deploy.sh
