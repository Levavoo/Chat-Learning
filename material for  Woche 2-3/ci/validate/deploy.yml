.test:ci-scripts-base:
  stage: validate
  interruptible: true
  image: gitlab.kilab-platform.de:5050/platform/ci-images/node-shell:0.1.0
  rules:
    - if: $PIPELINE_TASK
      when: never

test:ci-scripts:shellcheck:
  extends: .test:ci-scripts-base
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/**/*.sh
        - .gitlab/ci/scripts/lib/**/*
        - scripts/**/*.sh  # operator scripts in root
  script:
    - |
      find .gitlab/ci/scripts -name "*.sh" \
        -not -path "*/tests/*" | sort | xargs shellcheck

test:ci-scripts:lib:
  extends: .test:ci-scripts-base
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/lib/**/*
        - .gitlab/ci/scripts/tests/lib/**/*
  cache:
    key:
      files:
        - .gitlab/ci/scripts/package-lock.json
    paths:
      - .npm/
  before_script:
    # #662 — release-retention.test.mjs exercises the AWS SDK transport, and
    # asserts the dependency resolves at all. node-aws:0.6.0 does not ship it.
    - npm ci --prefix .gitlab/ci/scripts --cache .npm --prefer-offline
  script:
    - |
      node --test \
        .gitlab/ci/scripts/tests/lib/node/release-retention.test.mjs
      node --test \
        .gitlab/ci/scripts/tests/lib/node/retrieval-orchestration.test.mjs
      node --test \
        .gitlab/ci/scripts/tests/lib/node/retrieval-environment.test.mjs
      node --test \
        .gitlab/ci/scripts/tests/lib/node/preprod-foundation-diff.test.mjs
    - bats --print-output-on-failure .gitlab/ci/scripts/tests/lib/*.bats

test:ci-scripts:validate:
  extends: .test:ci-scripts-base
  rules:
    - if: $PIPELINE_TASK
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/scripts/validate/**/*
        - .gitlab/ci/scripts/lib/deploy.sh
        - .gitlab/ci/scripts/lib/qa-retrieval.sh
        - .gitlab/ci/scripts/tests/validate/**/*
  script:
    - bats --print-output-on-failure .gitlab/ci/scripts/tests/validate/

